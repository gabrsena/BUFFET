<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelie Kids | Buffet Infantil Wanel Ville Sorocaba</title>
    <meta name="description" content="O melhor salão de festa infantil no Wanel Ville, Sorocaba. Diversão, segurança e buffet de alta qualidade.">
    
    <!-- Favicon Corrigido -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Sora:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-purple': '#9333ea',
                        'brand-yellow': '#facc15',
                        'brand-pink': '#db2777',
                        'brand-turquoise': '#06b6d4',
                        'brand-orange': '#f97316',
                    },
                    fontFamily: {
                        sora: ['Sora', 'sans-serif'],
                        fredoka: ['Fredoka', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out infinite 2s',
                        'bounce-soft': 'bounce-soft 2s ease-in-out infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                        'pulse-glow': 'pulse-glow 3s ease-in-out infinite',
                        'pulse-glow-green': 'pulse-glow-green 3s ease-in-out infinite',
                        'shimmer': 'shimmer 2.5s linear infinite',
                        'blob-move': 'blob-move 25s infinite alternate',
                        'neon-purple': 'neon-purple 1.5s ease-in-out infinite alternate',
                        'neon-pink': 'neon-pink 1.5s ease-in-out infinite alternate',
                        'neon-turquoise': 'neon-turquoise 1.5s ease-in-out infinite alternate',
                        'neon-yellow': 'neon-yellow 1.5s ease-in-out infinite alternate',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* FORÇA O CONTEÚDO A APARECER IMEDIATAMENTE */
        #root {
            opacity: 1 !important;
            visibility: visible !important;
            display: block !important;
        }

        body { 
            font-family: 'Sora', sans-serif; 
            background-color: #0f172a; 
            color: white !important; 
            overflow-x: hidden; 
            scroll-behavior: smooth; 
            margin: 0;
            padding: 0;
        }
        
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-20px) rotate(5deg); } }
        @keyframes bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(147, 51, 234, 0.5); transform: scale(1); } 50% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.8); transform: scale(1.02); } }
        @keyframes pulse-glow-green { 0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); } 50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.7); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes blob-move { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
        
        .bubble-base {
            display: inline-block; padding: 0.5rem 2.5rem; border-radius: 9999px; text-transform: uppercase; font-weight: 900;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; line-height: 0.9;
            font-family: 'Fredoka', sans-serif !important;
        }
        .bubble-purple { background: #9333ea; color: white; box-shadow: 0 10px 0 #7e22ce; transform: rotate(-2deg); }
        .bubble-yellow { background: #facc15; color: #713f12; box-shadow: 0 10px 0 #ca8a04; transform: rotate(1.5deg); }
        .bubble-base:hover { transform: scale(1.1) rotate(0deg); }
        
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text-yellow { text-shadow: 0 0 10px #facc15; }
        .neon-text-pink { text-shadow: 0 0 10px #db2777; }
        .neon-text-purple { text-shadow: 0 0 10px #9333ea; }
        .shimmer-btn { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); background-size: 200% 100%; }
        
        .clip-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
    </style>
    <script>
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

    <div id="root"></div>
</body>
</html>
