<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelie Kids | Buffet Infantil Wanel Ville Sorocaba</title>
    <meta name="description" content="A festa mais mágica do Wanel Ville. Buffet infantil completo com recreação neon, segurança e muita diversão." />

    <!-- Favicon com emoji de balão (mantido igual) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>" />

    <!-- Fonts Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Sora:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind via CDN (você pode migrar para local depois, mas isso funciona) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Config Tailwind custom (cores e fonts) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-purple': '#9333ea',
              'brand-yellow': '#facc15',
              'brand-pink': '#db2777',
              'brand-turquoise': '#06b6d4',
            },
            fontFamily: {
              sora: ['Sora', 'sans-serif'],
              fredoka: ['Fredoka', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Todos os estilos custom, animações, classes etc. vão aqui -->
    <style>
      #root {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        min-height: 100vh;
        background-color: #0f172a;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Sora', sans-serif;
        background-color: #0f172a;
        color: white;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-20px) rotate(5deg); } }
      @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      @keyframes blob { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }

      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-wiggle { animation: wiggle 1s ease-in-out infinite; }
      .animate-blob { animation: blob 20s infinite alternate; }

      .bubble-base {
        display: inline-block;
        padding: 0.6rem 2.5rem;
        border-radius: 9999px;
        text-transform: uppercase;
        font-weight: 900;
        font-family: 'Fredoka', sans-serif;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        line-height: 1;
      }
      .bubble-purple { background: #9333ea; color: white; box-shadow: 0 8px 0 #7e22ce; transform: rotate(-2deg); }
      .bubble-yellow { background: #facc15; color: #713f12; box-shadow: 0 8px 0 #ca8a04; transform: rotate(1.5deg); }
      .bubble-base:hover { transform: scale(1.05) rotate(0deg); }

      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <!-- Ponto de montagem do React -->
    <div id="root"></div>

    <!-- Carrega o entry point do React (agora em src/main.jsx ou src/main.tsx) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
